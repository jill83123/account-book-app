name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # the Worker in worker/ is deployed separately with wrangler; docs, editor and lint settings never change the site
    paths-ignore:
      - 'worker/**'
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.oxlintrc.json'
      - 'eslint.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
